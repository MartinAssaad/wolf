<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wolf Cards</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="bg"></div>

    <div class="container">
      <button id="homeBtn" class="home-btn">🏠 Home</button>

      <!-- ========================= -->
      <!-- SETUP -->
      <!-- ========================= -->

      <section id="setup" class="page active">
        <h1>🐺 Wolf Cards</h1>

        <p class="subtitle">Create your game</p>

        <div class="panel">
          <div class="row">
            <span>🐺 Wolves</span>

            <div class="counter">
              <button id="wolfMinus">−</button>

              <span id="wolfValue">2</span>

              <button id="wolfPlus">+</button>
            </div>
          </div>

          <div class="row">
            <span>👨 Villagers</span>

            <div class="counter">
              <button id="villagerMinus">−</button>

              <span id="villagerValue">4</span>

              <button id="villagerPlus">+</button>
            </div>
          </div>

          <div class="check">
            <label>
              <input type="checkbox" id="doctor" checked />

              Doctor
            </label>
          </div>

          <div class="check">
            <label>
              <input type="checkbox" id="sheriff" checked />

              Sheriff
            </label>
          </div>

          <button id="startBtn" class="btn">Shuffle Cards</button>
        </div>
      </section>

      <!-- ========================= -->
      <!-- SHUFFLE -->
      <!-- ========================= -->

      <section id="shuffle" class="page">
        <div class="deck">
          <div class="deck-card"></div>

          <div class="deck-card"></div>

          <div class="deck-card"></div>
        </div>

        <h2>Shuffling...</h2>
      </section>

      <!-- ========================= -->
      <!-- PLAYER -->
      <!-- ========================= -->

      <section id="player" class="page">
        <h2 id="playerNumber">Player 1</h2>

        <p>Make sure nobody is looking.</p>

        <div id="card" class="card">
          <div class="card-inner">
            <!-- Front -->

            <div class="card-front">
              <div class="logo">🐺</div>

              <p>Tap to Reveal</p>
            </div>

            <!-- Back -->

            <div class="card-back" id="cardBack">
              <div id="emoji" class="emoji"></div>

              <h2 id="role"></h2>

              <p id="description"></p>
            </div>
          </div>
        </div>

        <button id="hideBtn" class="btn hidden">Hide Card</button>
      </section>

      <!-- ========================= -->
      <!-- PASS -->
      <!-- ========================= -->

      <section id="pass" class="page">
        <h2>Pass the Phone</h2>

        <p id="nextPlayer">Player 2</p>

        <button id="continueBtn" class="btn">Continue</button>
      </section>

      <!-- ========================= -->
      <!-- END -->
      <!-- ========================= -->

      <section id="finish" class="page">
        <h1>🎉</h1>

        <h2>Everyone has a role!</h2>

        <p>Start the game.</p>

        <button id="restartBtn" class="btn">New Game</button>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
